name: DARWIN CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Verify CLI version
        run: test "$(python -m darwin.cli.main --version)" = "darwin-sim 1.11.0"

      - name: List and validate scenarios
        run: python -m darwin.cli.main list-scenarios

      - name: Validate basic scenario
        run: python -m darwin.cli.main validate-scenario scenarios/001_basic_registration.yaml

      - name: Run all scenarios
        run: python scripts/run_all_scenarios.py

      - name: Verify checked-in scenario index
        run: |
          python -m darwin.cli.main scenario-index > /tmp/generated_scenario_index.md
          diff -u docs/SCENARIO_INDEX.md /tmp/generated_scenario_index.md

  wheel-smoke:
    name: Wheel build smoke (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "PyYAML>=6.0" "rich>=13.7"

      - name: Build wheel
        run: python -m build --wheel --outdir wheelhouse

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          cd /tmp
          test "$(python -m darwin.cli.main --version)" = "darwin-sim 1.11.0"
