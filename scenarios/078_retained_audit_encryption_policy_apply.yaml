scenario_id: 078_retained_audit_encryption_policy_apply
name: Encryption policy retained audit compaction apply
category: encryption
description: explicit policy audit compaction removes only selected policy history while preserving encrypted and direct delivery state
tags:
  - encryption
  - retained_audit
  - compaction
  - explicit_apply
  - v1.9
demonstrates:
  - a supported single-history decision removes only its policy decision candidate
  - reapplying the decision reports the removed key as missing
  - encrypted results nested policy snapshots direct delivery results and inboxes remain unchanged
expected_result: the second policy history record is removed while both encrypted results and all delivery side effects remain available
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
  devices:
    - device_id: dev_NEO
      label: neo
steps:
  - action: register_device
    registry_hub: registry_chat_001
    device: dev_NEO
    label: neo
  - action: register_lane_definition
    registry_hub: registry_chat_001
    lane_signature: basic_messaging:v1
  - action: register_mailbox
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    canonical_device_id: dev_NEO
    local_name: neo
    scope: global.chat
  - action: bind_mailbox_capability
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    lane_signature: basic_messaging:v1
  - action: register_adapter_endpoint
    registry_hub: registry_chat_001
    endpoint_id: endpoint_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
    adapter_kind: in_memory
    status: available
    lane_signatures:
      - basic_messaging:v1
    scope: global.chat
  - action: register_encryption_identity
    registry_hub: registry_chat_001
    encryption_identity_id: enc_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
  - action: register_key_bundle_reference
    registry_hub: registry_chat_001
    key_bundle_id: kb_mailbox_neo_001
    encryption_identity_id: enc_mailbox_neo
    public_ref: symbolic://public/mailbox_neo/001
  - action: register_mailbox_encryption_binding
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    required_for_lanes:
      - basic_messaging:v1
  - action: register_mailbox_encryption_policy
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    mailbox_id: mailbox_neo
  - action: evaluate_encrypted_delivery_request
    registry_hub: registry_chat_001
    request_id: request_keep_078
    message_id: message_keep_078
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    mailbox_id: mailbox_neo
    policy_id: policy_mailbox_neo
    envelope_id: envelope_keep_078
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
    attempt_delivery: true
    payload: preserved delivered payload
  - action: evaluate_encrypted_delivery_request
    registry_hub: registry_chat_001
    request_id: request_compact_078
    message_id: message_compact_078
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    mailbox_id: mailbox_neo
    policy_id: policy_mailbox_neo
    envelope_id: envelope_compact_078
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
    attempt_delivery: false
    payload: preserved deferred payload
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_encryption_policy_078
    history_types:
      - encryption_policy_decision
    record_history_types:
      - encryption_policy_decision
    max_records: 1
  - action: apply_retained_audit_compaction_decision
    registry_hub: registry_chat_001
    decision_policy_id: retained_audit_encryption_policy_078
  - action: apply_retained_audit_compaction_decision
    registry_hub: registry_chat_001
    decision_policy_id: retained_audit_encryption_policy_078
assertions:
  - type: retained_audit_compaction_apply_result_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_encryption_policy_078
    history_type: encryption_policy_decision
    compacted_count: 1
    retained_count: 1
    ignored_count: 0
    missing_count: 0
    unsupported_count: 0
    compacted_record_key: encryption_policy_decision:1:registry_chat_001:policy_mailbox_neo:mailbox_neo:message_compact_078:basic_messaging:v1:accepted:none
    retained_record_key: encryption_policy_decision:0:registry_chat_001:policy_mailbox_neo:mailbox_neo:message_keep_078:basic_messaging:v1:accepted:none
    expected_count: 1
  - type: retained_audit_compaction_apply_result_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_encryption_policy_078
    history_type: encryption_policy_decision
    compacted_count: 0
    missing_count: 1
    missing_record_key: encryption_policy_decision:1:registry_chat_001:policy_mailbox_neo:mailbox_neo:message_compact_078:basic_messaging:v1:accepted:none
    expected_count: 1
  - type: encryption_policy_decision_contains
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    message_id: message_compact_078
    expected_count: 0
  - type: encryption_policy_decision_contains
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    message_id: message_keep_078
    status: accepted
    expected_count: 1
  - type: encrypted_delivery_result_contains
    registry_hub: registry_chat_001
    request_id: request_compact_078
    message_id: message_compact_078
    status: not_delivered
    reason: delivery_not_attempted
    expected_count: 1
  - type: encrypted_delivery_result_contains
    registry_hub: registry_chat_001
    request_id: request_keep_078
    message_id: message_keep_078
    status: delivered
    expected_count: 1
  - type: message_delivery_result_contains
    registry_hub: registry_chat_001
    message_id: message_keep_078
    mailbox_id: mailbox_neo
    status: delivered
    endpoint_id: endpoint_mailbox_neo
    expected_count: 1
  - type: mailbox_inbox_contains
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    message_id: message_keep_078
    payload: preserved delivered payload
    expected_count: 1
