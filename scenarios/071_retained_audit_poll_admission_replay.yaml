scenario_id: 071_retained_audit_poll_admission_replay
name: Poll and admission retained audit replay
category: stream_offer
description: mixed poll and admission replay summaries group a shared request and preserve admission-only offer grouping through decision filters
tags:
  - stream_offer
  - retained_audit
  - rendezvous
  - lane_admission
  - replay_summary
  - decision_filter
  - v1.7
demonstrates:
  - poll and admission records sharing a request ID are grouped together
  - admission offer IDs contribute to replay grouping while poll matches do not
  - retained and compaction-candidate replay filters preserve the classification record universe
  - replay remains read-only for both retained histories
expected_result: the mixed replay groups two records under one request and only the admission under its offer before decision filters isolate each history
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
steps:
  - action: hold_stream_offer
    registry_hub: registry_chat_001
    offer_id: offer_audit_replay_071
    requester_id: dev_TRINITY
    target_handle: alias:neo
    lane_signature: basic_messaging:v1
    visibility_tier: 1
    rendezvous_scope: global.chat
  - action: poll_held_stream_offers
    registry_hub: registry_chat_001
    request_id: shared_request_071
    offer_id: offer_audit_replay_071
    polling_hub_id: hub_private_child
    requester_id: hub_private_child
    target_scope: global.chat
    visibility_tier: 1
    lane_signature: basic_messaging:v1
  - action: evaluate_lane_admission_policy
    registry_hub: registry_chat_001
    policy_id: lane_admission_policy_071
    decision_id: lane_admission_decision_071
    hub_id: registry_chat_001
    offer_id: offer_audit_replay_071
    poll_request_id: shared_request_071
    poll_result_request_id: shared_request_071
    require_discoverable: true
    default_status: pass_down
    decision_metadata:
      source: admission_replay_071
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_policy_071
    history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    record_history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    retain_reasons:
      - accepted
    compact_reasons:
      - offers_available
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    decision_policy_id: retained_audit_policy_071
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    decision_policy_id: retained_audit_policy_071
    decision_category: retained
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    decision_policy_id: retained_audit_policy_071
    decision_category: compaction_candidate
assertions:
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: mixed
    record_count: 2
    request_id: shared_request_071
    request_count: 2
    offer_id: offer_audit_replay_071
    offer_count: 1
    first_record_key: rendezvous_poll:0:registry_chat_001:hub_private_child:shared_request_071:global.chat:1:matched:offers_available:offer_audit_replay_071
    last_record_key: lane_admission:1:registry_chat_001:lane_admission_decision_071:lane_admission_policy_071:offer_audit_replay_071:shared_request_071:pass_down:accepted
    decision_category: all
    grouped_history_type: rendezvous_poll_result
    grouped_history_type_count: 1
    expected_count: 1
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: mixed
    record_count: 2
    decision_category: all
    grouped_history_type: lane_admission_decision
    grouped_history_type_count: 1
    expected_count: 1
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: lane_admission_decision
    record_count: 1
    request_id: shared_request_071
    request_count: 1
    offer_id: offer_audit_replay_071
    offer_count: 1
    record_key: lane_admission:1:registry_chat_001:lane_admission_decision_071:lane_admission_policy_071:offer_audit_replay_071:shared_request_071:pass_down:accepted
    decision_category: retained
    expected_count: 1
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: rendezvous_poll_result
    record_count: 1
    request_id: shared_request_071
    request_count: 1
    record_key: rendezvous_poll:0:registry_chat_001:hub_private_child:shared_request_071:global.chat:1:matched:offers_available:offer_audit_replay_071
    decision_category: compaction_candidate
    expected_count: 1
  - type: rendezvous_poll_result_contains
    registry_hub: registry_chat_001
    request_id: shared_request_071
    expected_count: 1
  - type: lane_admission_decision_contains
    registry_hub: registry_chat_001
    request_id: shared_request_071
    offer_id: offer_audit_replay_071
    expected_count: 1
