scenario_id: 077_retained_audit_encryption_policy_replay
name: Encryption policy retained audit replay
category: encryption
description: encryption policy replay summaries group policy lane message mailbox status and reason through decision filters
tags:
  - encryption
  - retained_audit
  - replay
  - v1.9
demonstrates:
  - replay summaries group policy decisions by policy and top-level lane
  - existing message mailbox status and reason groupings remain deterministic
  - decision-category filters isolate accepted and failed policy decisions
expected_result: the complete summary contains both policies and filtered summaries isolate the accepted and missing-envelope records
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
  devices:
    - device_id: dev_NEO
      label: neo
    - device_id: dev_TRINITY
      label: trinity
steps:
  - action: register_lane_definition
    registry_hub: registry_chat_001
    lane_signature: basic_messaging:v1
  - action: register_lane_definition
    registry_hub: registry_chat_001
    lane_signature: file_transfer:v1
  - action: register_mailbox
    registry_hub: registry_chat_001
    mailbox_id: mailbox_alpha
    canonical_device_id: dev_NEO
    local_name: neo
    scope: global.chat
  - action: register_mailbox
    registry_hub: registry_chat_001
    mailbox_id: mailbox_zeta
    canonical_device_id: dev_TRINITY
    local_name: trinity
    scope: global.chat
  - action: bind_mailbox_capability
    registry_hub: registry_chat_001
    mailbox_id: mailbox_alpha
    lane_signature: basic_messaging:v1
  - action: bind_mailbox_capability
    registry_hub: registry_chat_001
    mailbox_id: mailbox_zeta
    lane_signature: file_transfer:v1
  - action: register_encryption_identity
    registry_hub: registry_chat_001
    encryption_identity_id: enc_mailbox_alpha
    subject_id: mailbox_alpha
    subject_kind: mailbox
  - action: register_encryption_identity
    registry_hub: registry_chat_001
    encryption_identity_id: enc_mailbox_zeta
    subject_id: mailbox_zeta
    subject_kind: mailbox
  - action: register_key_bundle_reference
    registry_hub: registry_chat_001
    key_bundle_id: kb_mailbox_alpha_001
    encryption_identity_id: enc_mailbox_alpha
    public_ref: symbolic://public/mailbox_alpha/001
  - action: register_key_bundle_reference
    registry_hub: registry_chat_001
    key_bundle_id: kb_mailbox_zeta_001
    encryption_identity_id: enc_mailbox_zeta
    public_ref: symbolic://public/mailbox_zeta/001
  - action: register_mailbox_encryption_binding
    registry_hub: registry_chat_001
    mailbox_id: mailbox_alpha
    encryption_identity_id: enc_mailbox_alpha
    key_bundle_id: kb_mailbox_alpha_001
    required_for_lanes:
      - basic_messaging:v1
  - action: register_mailbox_encryption_binding
    registry_hub: registry_chat_001
    mailbox_id: mailbox_zeta
    encryption_identity_id: enc_mailbox_zeta
    key_bundle_id: kb_mailbox_zeta_001
    required_for_lanes:
      - file_transfer:v1
  - action: register_mailbox_encryption_policy
    registry_hub: registry_chat_001
    policy_id: policy_alpha
    mailbox_id: mailbox_alpha
    required_for_lanes:
      - basic_messaging:v1
  - action: register_mailbox_encryption_policy
    registry_hub: registry_chat_001
    policy_id: policy_zeta
    mailbox_id: mailbox_zeta
    required_for_lanes:
      - file_transfer:v1
  - action: evaluate_mailbox_encryption_policy
    registry_hub: registry_chat_001
    mailbox_id: mailbox_alpha
    lane_signature: basic_messaging:v1
    message_id: message_alpha_077
    envelope_id: envelope_alpha_077
    encryption_identity_id: enc_mailbox_alpha
    key_bundle_id: kb_mailbox_alpha_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
  - action: evaluate_mailbox_encryption_policy
    registry_hub: registry_chat_001
    mailbox_id: mailbox_zeta
    lane_signature: file_transfer:v1
    message_id: message_zeta_077
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_encryption_policy_077
    history_types:
      - encryption_policy_decision
    record_history_types:
      - encryption_policy_decision
    compact_statuses:
      - missing_envelope
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - encryption_policy_decision
    decision_policy_id: retained_audit_encryption_policy_077
    decision_category: all
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - encryption_policy_decision
    decision_policy_id: retained_audit_encryption_policy_077
    decision_category: retained
  - action: summarize_retained_audit_replay
    registry_hub: registry_chat_001
    record_history_types:
      - encryption_policy_decision
    decision_policy_id: retained_audit_encryption_policy_077
    decision_category: compaction_candidate
assertions:
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: encryption_policy_decision
    record_count: 2
    policy_id: policy_alpha
    policy_count: 1
    lane_signature: file_transfer:v1
    lane_signature_count: 1
    message_id: message_zeta_077
    message_count: 1
    mailbox_id: mailbox_alpha
    mailbox_count: 1
    grouped_history_type: encryption_policy_decision
    grouped_history_type_count: 2
    decision_category: all
    expected_count: 1
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: encryption_policy_decision
    record_count: 1
    policy_id: policy_alpha
    policy_count: 1
    lane_signature: basic_messaging:v1
    lane_signature_count: 1
    status: accepted
    status_count: 1
    reason: none
    reason_count: 1
    message_id: message_alpha_077
    message_count: 1
    mailbox_id: mailbox_alpha
    mailbox_count: 1
    decision_category: retained
    expected_count: 1
  - type: retained_audit_replay_summary_contains
    registry_hub: registry_chat_001
    history_type: encryption_policy_decision
    record_count: 1
    policy_id: policy_zeta
    policy_count: 1
    lane_signature: file_transfer:v1
    lane_signature_count: 1
    status: missing_envelope
    status_count: 1
    reason: missing_envelope
    reason_count: 1
    message_id: message_zeta_077
    message_count: 1
    mailbox_id: mailbox_zeta
    mailbox_count: 1
    decision_category: compaction_candidate
    expected_count: 1
