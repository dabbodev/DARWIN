scenario_id: 081_retained_audit_message_delivery_apply
name: Message delivery retained audit compaction apply
category: mailbox
description: explicit direct message delivery audit compaction removes only selected result history
tags:
  - mailbox
  - retained_audit
  - compaction
  - explicit_apply
  - v1.10
demonstrates:
  - a supported single-history decision removes only its direct delivery candidate
  - reapplying the decision reports the removed key as missing
  - inboxes encrypted results policy decisions and routing state remain unchanged
expected_result: the bounced direct result is removed while delivered messages inboxes encrypted audit state and traffic state remain available
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
  traffic_hubs:
    - hub_id: traffic_chat_001
  devices:
    - device_id: dev_NEO
      label: neo
steps:
  - action: register_device
    registry_hub: registry_chat_001
    device: dev_NEO
    label: neo
  - action: register_lane_definition
    registry_hub: registry_chat_001
    lane_signature: basic_messaging:v1
  - action: register_mailbox
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    canonical_device_id: dev_NEO
    local_name: neo
    scope: global.chat
  - action: bind_mailbox_capability
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    lane_signature: basic_messaging:v1
  - action: register_adapter_endpoint
    registry_hub: registry_chat_001
    endpoint_id: endpoint_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
    adapter_kind: in_memory
    status: available
    lane_signatures:
      - basic_messaging:v1
    scope: global.chat
  - action: register_encryption_identity
    registry_hub: registry_chat_001
    encryption_identity_id: enc_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
  - action: register_key_bundle_reference
    registry_hub: registry_chat_001
    key_bundle_id: kb_mailbox_neo_001
    encryption_identity_id: enc_mailbox_neo
    public_ref: symbolic://public/mailbox_neo/001
  - action: register_mailbox_encryption_binding
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    required_for_lanes:
      - basic_messaging:v1
  - action: register_mailbox_encryption_policy
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    mailbox_id: mailbox_neo
  - action: evaluate_encrypted_delivery_request
    registry_hub: registry_chat_001
    request_id: request_encrypted_081
    message_id: message_encrypted_081
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    mailbox_id: mailbox_neo
    policy_id: policy_mailbox_neo
    envelope_id: envelope_encrypted_081
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
    attempt_delivery: true
    payload: preserved encrypted delivery
  - action: deliver_message
    registry_hub: registry_chat_001
    message_id: message_keep_081
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    payload: preserved direct delivery
  - action: deliver_message
    registry_hub: registry_chat_001
    message_id: message_compact_081
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.missing/inbox
    payload: compacted result only
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_message_delivery_081
    history_types:
      - message_delivery_result
    record_history_types:
      - message_delivery_result
    compact_statuses:
      - bounced
  - action: apply_retained_audit_compaction_decision
    registry_hub: registry_chat_001
    decision_policy_id: retained_audit_message_delivery_081
  - action: apply_retained_audit_compaction_decision
    registry_hub: registry_chat_001
    decision_policy_id: retained_audit_message_delivery_081
assertions:
  - type: retained_audit_compaction_apply_result_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_message_delivery_081
    history_type: message_delivery_result
    compacted_count: 1
    retained_count: 2
    ignored_count: 0
    missing_count: 0
    unsupported_count: 0
    compacted_record_key: message_delivery_result:2:registry_chat_001:message_compact_081:darwin://global.chat.missing/inbox:none:basic_messaging:v1:bounced:mailbox_not_found
    retained_record_keys:
      - message_delivery_result:0:registry_chat_001:message_encrypted_081:darwin://global.chat.neo/inbox:mailbox_neo:basic_messaging:v1:delivered:none
      - message_delivery_result:1:registry_chat_001:message_keep_081:darwin://global.chat.neo/inbox:mailbox_neo:basic_messaging:v1:delivered:none
    expected_count: 1
  - type: retained_audit_compaction_apply_result_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_message_delivery_081
    history_type: message_delivery_result
    compacted_count: 0
    missing_count: 1
    missing_record_key: message_delivery_result:2:registry_chat_001:message_compact_081:darwin://global.chat.missing/inbox:none:basic_messaging:v1:bounced:mailbox_not_found
    expected_count: 1
  - type: message_delivery_result_contains
    registry_hub: registry_chat_001
    message_id: message_compact_081
    expected_count: 0
  - type: message_delivery_result_contains
    registry_hub: registry_chat_001
    message_id: message_encrypted_081
    mailbox_id: mailbox_neo
    status: delivered
    expected_count: 1
  - type: message_delivery_result_contains
    registry_hub: registry_chat_001
    message_id: message_keep_081
    mailbox_id: mailbox_neo
    status: delivered
    expected_count: 1
  - type: mailbox_inbox_contains
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    message_id: message_encrypted_081
    payload: preserved encrypted delivery
    expected_count: 1
  - type: mailbox_inbox_contains
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    message_id: message_keep_081
    payload: preserved direct delivery
    expected_count: 1
  - type: encrypted_delivery_result_contains
    registry_hub: registry_chat_001
    request_id: request_encrypted_081
    message_id: message_encrypted_081
    status: delivered
    expected_count: 1
  - type: encryption_policy_decision_contains
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    message_id: message_encrypted_081
    status: accepted
    expected_count: 1
