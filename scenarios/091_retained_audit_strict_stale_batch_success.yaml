scenario_id: 091_retained_audit_strict_stale_batch_success
name: Retained audit strict-stale batch success
category: registry
description: fresh reverse-ordered decisions apply atomically in canonical retained-audit history order when strict stale protection is enabled
tags:
  - retained_audit
  - batch_apply
  - strict_stale
  - deterministic
  - v1.14
demonstrates:
  - a point-in-time correlation-only preview does not reserve or mutate candidates
  - strict stale protection accepts a fully fresh multi-history batch
  - caller decision order does not change canonical batch result order
  - aggregate metadata records strict stale protection as enabled
expected_result: fresh message delivery and authority outcome candidates compact successfully with strict metadata true and no missing keys
setup:
  registry_hubs:
    - hub_id: registry_home_091
      scope_path: global.family.david.home
      parent_hub_id: registry_family_091
    - hub_id: registry_family_091
      scope_path: global.family.david
      parent_hub_id: registry_global_091
      alias_authority_policy:
        allow_pass_up: false
        allow_fallback: true
    - hub_id: registry_global_091
      scope_path: global
  devices:
    - device_id: dev_ALPHA_091
      label: alpha
    - device_id: dev_BETA_091
      label: beta
    - device_id: dev_NEO_091
      label: neo
steps:
  - action: register_device
    registry_hub: registry_home_091
    device: dev_ALPHA_091
    label: alpha
  - action: register_device
    registry_hub: registry_family_091
    device: dev_ALPHA_091
    label: alpha
  - action: register_device
    registry_hub: registry_global_091
    device: dev_ALPHA_091
    label: alpha
  - action: register_device
    registry_hub: registry_home_091
    device: dev_BETA_091
    label: beta
  - action: register_device
    registry_hub: registry_family_091
    device: dev_BETA_091
    label: beta
  - action: register_device
    registry_hub: registry_global_091
    device: dev_BETA_091
    label: beta
  - action: register_device
    registry_hub: registry_home_091
    device: dev_NEO_091
    label: neo
  - action: register_lane_definition
    registry_hub: registry_home_091
    lane_signature: basic_messaging:v1
  - action: register_mailbox
    registry_hub: registry_home_091
    mailbox_id: mailbox_neo_091
    canonical_device_id: dev_NEO_091
    local_name: neo
    scope: global.family.david.home
  - action: bind_mailbox_capability
    registry_hub: registry_home_091
    mailbox_id: mailbox_neo_091
    lane_signature: basic_messaging:v1
  - action: register_adapter_endpoint
    registry_hub: registry_home_091
    endpoint_id: endpoint_mailbox_neo_091
    subject_id: mailbox_neo_091
    subject_kind: mailbox
    adapter_kind: in_memory
    status: available
    lane_signatures:
      - basic_messaging:v1
    scope: global.family.david.home
  - action: deliver_message
    registry_hub: registry_home_091
    message_id: message_keep_091
    sender_id: dev_ALPHA_091
    recipient_address: darwin://global.family.david.home.neo/inbox
    payload: preserved delivery
  - action: deliver_message
    registry_hub: registry_home_091
    message_id: message_compact_091
    sender_id: dev_ALPHA_091
    recipient_address: darwin://global.family.david.home.missing/inbox
    payload: compacted delivery result
  - action: claim_alias_through_authority_chain
    registry_hub: registry_home_091
    requested_alias: global.alpha
    local_name: alpha
    target_device: dev_ALPHA_091
    requested_by_device: dev_ALPHA_091
    fallback_allowed: true
    visibility: scope_local
  - action: claim_alias_through_authority_chain
    registry_hub: registry_home_091
    requested_alias: global.alpha
    local_name: alpha
    target_device: dev_BETA_091
    requested_by_device: dev_BETA_091
    fallback_allowed: true
    visibility: scope_local
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_home_091
    policy_id: retained_audit_authority_091
    history_types:
      - authority_outcome
    record_history_types:
      - authority_outcome
    compact_statuses:
      - name_taken
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_home_091
    policy_id: retained_audit_message_delivery_091
    history_types:
      - message_delivery_result
    record_history_types:
      - message_delivery_result
    compact_statuses:
      - bounced
  - action: preview_retained_audit_compaction_batch
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    decision_policy_ids:
      authority_outcome: retained_audit_authority_091
      message_delivery_result: retained_audit_message_delivery_091
    metadata:
      caller_order: reverse_canonical
  - action: apply_retained_audit_compaction_batch
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    decision_policy_ids:
      authority_outcome: retained_audit_authority_091
      message_delivery_result: retained_audit_message_delivery_091
    strict_stale_abort: true
    metadata:
      caller_order: reverse_canonical
      strict_stale_abort: false
assertions:
  - type: retained_audit_compaction_batch_preview_result_contains
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    history_types:
      - message_delivery_result
      - authority_outcome
    would_compact_count: 2
    retained_count: 2
    ignored_count: 0
    missing_count: 0
    unsupported_count: 0
    expected_count: 1
  - type: retained_audit_compaction_batch_apply_result_contains
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    strict_stale_abort: true
    history_types:
      - message_delivery_result
      - authority_outcome
    compacted_count: 2
    retained_count: 2
    ignored_count: 0
    missing_count: 0
    unsupported_count: 0
    expected_count: 1
  - type: retained_audit_compaction_batch_apply_result_contains
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    strict_stale_abort: false
    expected_count: 0
  - type: retained_audit_compaction_batch_apply_result_contains
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    history_type: message_delivery_result
    policy_id: retained_audit_message_delivery_091
    history_compacted_count: 1
    history_missing_count: 0
    expected_count: 1
  - type: retained_audit_compaction_batch_apply_result_contains
    registry_hub: registry_home_091
    batch_id: retained_audit_batch_091
    history_type: authority_outcome
    policy_id: retained_audit_authority_091
    history_compacted_count: 1
    history_missing_count: 0
    expected_count: 1
  - type: message_delivery_result_contains
    registry_hub: registry_home_091
    message_id: message_compact_091
    expected_count: 0
  - type: message_delivery_result_contains
    registry_hub: registry_home_091
    message_id: message_keep_091
    mailbox_id: mailbox_neo_091
    status: delivered
    expected_count: 1
  - type: authority_outcome_history_contains
    registry_hub: registry_home_091
    requested_alias: global.alpha
    device_id: dev_BETA_091
    final_status: name_taken
    expected_count: 0
  - type: authority_outcome_history_contains
    registry_hub: registry_home_091
    requested_alias: global.alpha
    granted_alias: global.family.david.alpha
    device_id: dev_ALPHA_091
    final_status: fallback_granted
    expected_count: 1
  - type: mailbox_inbox_contains
    registry_hub: registry_home_091
    mailbox_id: mailbox_neo_091
    message_id: message_keep_091
    payload: preserved delivery
    expected_count: 1
