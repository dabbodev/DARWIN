scenario_id: 070_retained_audit_poll_admission_classification
name: Poll and admission retained audit classification
category: stream_offer
description: retained rendezvous poll and lane-admission records are classified together without mutating either history
tags:
  - stream_offer
  - retained_audit
  - rendezvous
  - lane_admission
  - classification
  - v1.7
demonstrates:
  - retained poll and admission histories participate in mixed audit classification
  - poll and admission reasons can independently select compaction candidates
  - classification remains read-only for both retained histories
expected_result: the mixed decision reports one poll and one admission candidate while both source histories remain intact
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
steps:
  - action: hold_stream_offer
    registry_hub: registry_chat_001
    offer_id: offer_audit_classify_070
    requester_id: dev_TRINITY
    target_handle: alias:neo
    lane_signature: basic_messaging:v1
    visibility_tier: 1
    rendezvous_scope: global.chat
  - action: poll_held_stream_offers
    registry_hub: registry_chat_001
    request_id: poll_req_audit_classify_070
    offer_id: offer_audit_classify_070
    polling_hub_id: hub_private_child
    requester_id: hub_private_child
    target_scope: global.chat
    visibility_tier: 1
    lane_signature: basic_messaging:v1
  - action: evaluate_lane_admission_policy
    registry_hub: registry_chat_001
    policy_id: lane_admission_policy_070
    decision_id: lane_admission_decision_070
    hub_id: registry_chat_001
    offer_id: offer_audit_classify_070
    poll_request_id: poll_req_audit_classify_070
    poll_result_request_id: poll_req_audit_classify_070
    require_discoverable: true
    default_status: pass_down
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_policy_070
    history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    record_history_types:
      - rendezvous_poll_result
      - lane_admission_decision
    compact_reasons:
      - offers_available
      - accepted
assertions:
  - type: retained_audit_compaction_decision_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_policy_070
    history_type: mixed
    retained_count: 0
    compaction_candidate_count: 2
    ignored_count: 0
    candidate_history_type: rendezvous_poll_result
    candidate_history_type_count: 1
    compaction_candidate_record_key: rendezvous_poll:0:registry_chat_001:hub_private_child:poll_req_audit_classify_070:global.chat:1:matched:offers_available:offer_audit_classify_070
    expected_count: 1
  - type: retained_audit_compaction_decision_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_policy_070
    candidate_history_type: lane_admission_decision
    candidate_history_type_count: 1
    compaction_candidate_record_key: lane_admission:1:registry_chat_001:lane_admission_decision_070:lane_admission_policy_070:offer_audit_classify_070:poll_req_audit_classify_070:pass_down:accepted
    expected_count: 1
  - type: rendezvous_poll_result_contains
    registry_hub: registry_chat_001
    request_id: poll_req_audit_classify_070
    status: matched
    reason: offers_available
    expected_count: 1
  - type: lane_admission_decision_contains
    registry_hub: registry_chat_001
    decision_id: lane_admission_decision_070
    request_id: poll_req_audit_classify_070
    status: pass_down
    reason: accepted
    expected_count: 1
  - type: held_stream_offer_contains
    registry_hub: registry_chat_001
    offer_id: offer_audit_classify_070
    status: held
    expected_count: 1
