scenario_id: 073_retained_audit_encrypted_delivery_classification
name: Encrypted delivery retained audit classification
category: encryption
description: encrypted delivery result histories classify retained and compactable records without mutation
tags:
  - encryption
  - retained_audit
  - compaction
  - v1.8
demonstrates:
  - RegistryHub metadata owns retained encrypted delivery results
  - top-level delivery status and reason drive generic compaction filters
  - source metadata participates without reinterpreting result note metadata
  - classification remains read-only
expected_result: the delivered result is retained and the deferred result is a compaction candidate while both remain in history
setup:
  registry_hubs:
    - hub_id: registry_chat_001
      scope_path: global.chat
  devices:
    - device_id: dev_NEO
      label: neo
steps:
  - action: register_device
    registry_hub: registry_chat_001
    device: dev_NEO
    label: neo
  - action: register_lane_definition
    registry_hub: registry_chat_001
    lane_signature: basic_messaging:v1
  - action: register_mailbox
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    canonical_device_id: dev_NEO
    local_name: neo
    scope: global.chat
  - action: bind_mailbox_capability
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    lane_signature: basic_messaging:v1
  - action: register_adapter_endpoint
    registry_hub: registry_chat_001
    endpoint_id: endpoint_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
    adapter_kind: in_memory
    status: available
    lane_signatures:
      - basic_messaging:v1
    scope: global.chat
  - action: register_encryption_identity
    registry_hub: registry_chat_001
    encryption_identity_id: enc_mailbox_neo
    subject_id: mailbox_neo
    subject_kind: mailbox
  - action: register_key_bundle_reference
    registry_hub: registry_chat_001
    key_bundle_id: kb_mailbox_neo_001
    encryption_identity_id: enc_mailbox_neo
    public_ref: symbolic://public/mailbox_neo/001
  - action: register_mailbox_encryption_binding
    registry_hub: registry_chat_001
    mailbox_id: mailbox_neo
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    required_for_lanes:
      - basic_messaging:v1
  - action: register_mailbox_encryption_policy
    registry_hub: registry_chat_001
    policy_id: policy_mailbox_neo
    mailbox_id: mailbox_neo
  - action: evaluate_encrypted_delivery_request
    registry_hub: registry_chat_001
    request_id: request_keep_073
    message_id: message_keep_073
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    mailbox_id: mailbox_neo
    policy_id: policy_mailbox_neo
    envelope_id: envelope_keep_073
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
    attempt_delivery: true
    source: delivery_completed
    payload: retained payload
  - action: evaluate_encrypted_delivery_request
    registry_hub: registry_chat_001
    request_id: request_compact_073
    message_id: message_compact_073
    sender_id: dev_TRINITY
    recipient_address: darwin://global.chat.neo/inbox
    mailbox_id: mailbox_neo
    policy_id: policy_mailbox_neo
    envelope_id: envelope_compact_073
    encryption_identity_id: enc_mailbox_neo
    key_bundle_id: kb_mailbox_neo_001
    profile: symbolic_e2ee_v1
    state: symbolically_encrypted
    status: ready
    attempt_delivery: false
    source: delivery_deferred
    payload: compactable payload
  - action: classify_retained_audit_records_for_compaction
    registry_hub: registry_chat_001
    policy_id: retained_audit_encrypted_policy_073
    history_types:
      - encrypted_delivery_result
    record_history_types:
      - encrypted_delivery_result
    retain_statuses:
      - delivered
    compact_statuses:
      - not_delivered
assertions:
  - type: retained_audit_compaction_decision_contains
    registry_hub: registry_chat_001
    policy_id: retained_audit_encrypted_policy_073
    history_type: encrypted_delivery_result
    retained_count: 1
    compaction_candidate_count: 1
    ignored_count: 0
    candidate_history_type: encrypted_delivery_result
    candidate_history_type_count: 1
    candidate_status: not_delivered
    candidate_status_count: 1
    candidate_reason: delivery_not_attempted
    candidate_reason_count: 1
    candidate_source: delivery_deferred
    candidate_source_count: 1
    compaction_candidate_record_key: encrypted_delivery_result:1:registry_chat_001:request_compact_073:message_compact_073:mailbox_neo:basic_messaging:v1:not_delivered:delivery_not_attempted
    expected_count: 1
  - type: encrypted_delivery_result_contains
    registry_hub: registry_chat_001
    request_id: request_keep_073
    status: delivered
    expected_count: 1
  - type: encrypted_delivery_result_contains
    registry_hub: registry_chat_001
    request_id: request_compact_073
    status: not_delivered
    reason: delivery_not_attempted
    expected_count: 1
